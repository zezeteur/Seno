name: seno
description: Une application de paiement rapide
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  hugeicons: ^1.1.1
  supabase_flutter: ^2.10.0
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  lottie: ^3.1.2
  http: ^1.1.0
  shimmer: ^4.0.0
  smart_auth: ^3.2.0
  url_launcher: ^6.3.2
  local_auth: ^3.0.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.3
  flutter_contacts: ^2.5.0
  cached_network_image: ^4.0.2
  share_plus: ^13.3.0
  country_flags: ^4.1.2
  gal: ^2.3.3
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  characters: ^1.4.1
  material_color_utilities: ^0.13.0
  meta: ^1.17.0
  test_api: ^0.7.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/pattern.png
    - assets/images/seno-logo.png
    - assets/images/ios-icon.png
    - assets/jsons/
    - assets/jsons/OpenStore.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"
  adaptive_icon_background: "#FDFE96"
  adaptive_icon_foreground: "assets/images/app-icon-foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

